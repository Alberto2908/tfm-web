<section class="auth-page">
  <div class="auth-card">
    <div class="auth-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1 class="auth-title">Login</h1>

    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label class="auth-label">
        Nombre de usuario
        <input
          class="auth-input"
          type="text"
          autocomplete="username"
          formControlName="username"
          placeholder="Introduce tu nombre de usuario"
        />
      </label>

      <label class="auth-label">
        Contraseña
        <app-password-input
          formControlName="password"
          autocomplete="current-password"
          placeholder="Introduce tu contraseña"
        />
      </label>

      <div class="auth-form__actions">
        <button
          class="auth-submit"
          type="submit"
          [disabled]="loginForm.invalid || isLoading"
        >
          {{ isLoading ? "Iniciando sesión..." : "Entrar" }}
        </button>
      </div>
    </form>

    <p class="auth-footer">
      ¿No tienes cuenta?
      <a routerLink="/registrar" class="auth-link">Regístrate</a>
    </p>
  </div>
</section>
